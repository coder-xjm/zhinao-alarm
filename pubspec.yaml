name: zhinao_alarm
description: "智闹 —— 日期规则 + 目标时间双条件智能闹钟（小米手机专用）"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 中文界面本地化：日期选择器等系统组件的文案走中文。
  # 由 Flutter SDK 自带，不需要联网下载；它要求 intl 精确等于 0.19.0，
  # 与下面 intl 的 ^0.19.0 约束兼容。
  flutter_localizations:
    sdk: flutter
  # 本地数据库：存闹钟配置
  # ⚠️ 必须锁死精确版本。^2.3.3 会让云端解析到新版 sqflite，
  #    新版 Android 代码要求 Kotlin 1.9+，与锁定的工具链不兼容（Kotlin 编译错误）。
  sqflite: 2.3.3
  # 数据库文件路径
  path: ^1.9.0
  # 日期格式化（周一 / 9月28日 这类中文展示）
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
