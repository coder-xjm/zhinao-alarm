name: 构建智闹 APK

# 什么时候跑：
#   1) 你往仓库推送代码时自动跑
#   2) 也可以在 Actions 页面手动点 "Run workflow" 触发
on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    # 用 GitHub 免费提供的 Ubuntu 云主机，Android SDK 和 JDK 都是预装好的
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 1. 拉取源码
        uses: actions/checkout@v4

      - name: 2. 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      # ⚠️ 必须锁具体版本，不能用 stable。脚手架的 AGP/Kotlin/Gradle 版本必须和
      #    我们覆盖进去的 android/app/build.gradle 写法配套，锁版本才不会漂移。
      #    Flutter 3.24.5 官方模板：Gradle 8.3 + AGP 8.1.0 + Kotlin 1.8.22 + Java 目标 1.8
      - name: 3. 安装 Flutter SDK（锁定 3.24.5）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: 3.1 打印工具链版本（方便排查）
        run: |
          flutter --version
          java -version

      # 本仓库只提交了「自己的源码」，没提交 flutter create 生成的那堆脚手架文件
      # （gradle wrapper 之类）。这一步在云端现场生成脚手架，再把源码盖上去。
      #
      # 重要原则：
      #   · settings.gradle / 根 build.gradle / gradle.properties 保留脚手架自带的版本
      #     —— 它们和 Flutter 版本是官方配好对的；
      #   · 只覆盖 app/build.gradle（为了 minSdk = 24 和 androidx.core 依赖），
      #     并把编译目标对齐到模板的 Java 1.8。
      - name: 4. 组装完整 Flutter 工程
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE"
          OUT="$RUNNER_TEMP/zhinao_build"

          flutter create --org com.zhinao --project-name alarm --platforms android "$OUT"

          # 删掉脚手架里可能出现的 Kotlin DSL 脚本，避免和我们的 Groovy 脚本打架
          find "$OUT/android" -name "*.gradle.kts" -delete

          # ---- 用项目源码覆盖脚手架 ----
          cp "$SRC/pubspec.yaml"          "$OUT/pubspec.yaml"
          cp "$SRC/analysis_options.yaml" "$OUT/analysis_options.yaml"
          rm -rf "$OUT/lib"
          cp -r "$SRC/lib" "$OUT/lib"

          APP="$OUT/android/app/src/main"
          cp "$SRC/android/app/src/main/AndroidManifest.xml" "$APP/AndroidManifest.xml"
          cp "$SRC/android/app/src/main/res/values/styles.xml" "$APP/res/values/styles.xml"
          mkdir -p "$APP/res/values-night"
          cp "$SRC/android/app/src/main/res/values-night/styles.xml" "$APP/res/values-night/styles.xml"

          rm -rf "$APP/kotlin"
          mkdir -p "$APP/kotlin/com/zhinao/alarm"
          cp "$SRC"/android/app/src/main/kotlin/com/zhinao/alarm/*.kt "$APP/kotlin/com/zhinao/alarm/"

          cp "$SRC/android/app/build.gradle" "$OUT/android/app/build.gradle"

          # ---- 兼容补丁 1：编译目标对齐到模板的 Java 1.8 ----
          # 插件模块（sqflite 等）全部按 1.8 编译，app 模块若用 17 会触发
          # Kotlin 的 "Inconsistent JVM-target compatibility" 硬错误。
          # 本地项目文件已修正为 1.8；这条 sed 防止旧版本文件混进来，是幂等空操作。
          sed -i \
            -e "s/JavaVersion\.VERSION_17/JavaVersion.VERSION_1_8/g" \
            -e "s/jvmTarget = \"17\"/jvmTarget = JavaVersion.VERSION_1_8/" \
            "$OUT/android/app/build.gradle"

          # ---- 兼容补丁 2：withValues -> withOpacity ----
          # 仓库里的部分源码曾用 Flutter 3.27 才有的 Color.withValues(alpha:)。
          # 统一替换成所有版本都支持的 withOpacity()。本地代码已改成通用写法，
          # 这一步在那种情况下是空操作；留着它是为了防止旧写法混进来。
          find "$OUT/lib" -name "*.dart" -print0 | xargs -0 sed -i "s/\.withValues(alpha:/\.withOpacity(/g"
          echo "withValues 残留（应为 0）: $(grep -r "withValues" "$OUT/lib" | wc -l)"

          # ---- 自检：确认关键文件都到位、配置正确 ----
          echo "===== 组装完成，关键文件检查 ====="
          ls -1 "$OUT/lib" "$OUT/lib/core" "$OUT/lib/pages" "$APP/kotlin/com/zhinao/alarm"
          echo "----- minSdk 与编译目标 -----"
          grep -n -E "minSdk|Compatibility|jvmTarget" "$OUT/android/app/build.gradle"

      - name: 5. 拉取 Dart 依赖
        working-directory: ${{ runner.temp }}/zhinao_build
        run: flutter pub get

      # 静态检查：Dart 层的 API 错误在这里就能暴露，不用等 Gradle。
      # 故意不阻断构建（|| true），只把 error 级别的问题变成红色注解。
      - name: 6. Dart 静态检查（报错变成注解，不阻断）
        working-directory: ${{ runner.temp }}/zhinao_build
        run: |
          flutter analyze --no-pub > "$RUNNER_TEMP/analyze_log.txt" 2>&1 || true
          grep -E "error •" "$RUNNER_TEMP/analyze_log.txt" | tail -20 | while IFS= read -r l; do
            l="${l//$'\r'/}"
            l="${l//%/%25}"
            echo "::error::$l"
          done
          echo "===== analyze 结果 ====="
          tail -5 "$RUNNER_TEMP/analyze_log.txt"

      - name: 7. 编译 release APK
        working-directory: ${{ runner.temp }}/zhinao_build
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee "$RUNNER_TEMP/build_log.txt"

      # 构建失败时，把报错关键行提取出来变成「注解」——
      # 注解不需要管理员权限就能远程读到，方便直接定位问题。
      - name: 8. 失败时提取报错（变成注解）
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build_log.txt"
          if [ -f "$LOG" ]; then
            echo "===== What went wrong / 报错关键行 ====="
            grep -n -iE "error|FAILURE|Exception|What went wrong" "$LOG" | tail -30 | while IFS= read -r l; do
              l="${l//$'\r'/}"
              l="${l//%/%25}"
              echo "::error::$l"
            done
            echo "===== 日志最后 50 行 ====="
            tail -50 "$LOG"
          else
            echo "::error::构建日志文件不存在，失败发生在更早的步骤"
          fi

      - name: 9. 收集产物
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$RUNNER_TEMP/zhinao_build/build/app/outputs/flutter-apk/app-release.apk" \
             "$GITHUB_WORKSPACE/out/zhinao-alarm-v1.0.0.apk"
          ls -lh "$GITHUB_WORKSPACE/out/"

      - name: 10. 上传 APK（在本次运行页面底部下载）
        uses: actions/upload-artifact@v4
        with:
          name: zhinao-alarm-apk
          path: ${{ github.workspace }}/out/zhinao-alarm-v1.0.0.apk
          if-no-files-found: error
