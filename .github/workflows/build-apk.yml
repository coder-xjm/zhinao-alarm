name: 构建智闹 APK

# 什么时候跑：
#   1) 你往仓库推送代码时自动跑
#   2) 也可以在 Actions 页面手动点 "Run workflow" 触发
on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    # 用 GitHub 免费提供的 Ubuntu 云主机，Android SDK 和 JDK 都是预装好的
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 1. 拉取源码
        uses: actions/checkout@v4

      - name: 2. 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      # ⚠️ 必须锁具体版本，不能用 stable。脚手架的 AGP/Kotlin/Gradle 版本必须和
      #    我们覆盖进去的 android/app/build.gradle 写法配套，锁版本才不会漂移。
      #    工具链组合：Flutter 3.24.5 + Gradle 8.3 + AGP 8.1.0 + Kotlin 1.9.24 + Java 目标 1.8
      - name: 3. 安装 Flutter SDK（锁定 3.24.5）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: 3.1 打印工具链版本（方便排查）
        run: |
          flutter --version
          java -version

      # 本仓库只提交了「自己的源码」，没提交 flutter create 生成的那堆脚手架文件
      # （gradle wrapper 之类）。这一步在云端现场生成脚手架，再把源码盖上去。
      #
      # 重要原则：
      #   · settings.gradle / 根 build.gradle / gradle.properties 保留脚手架自带的版本
      #     —— 它们和 Flutter 版本是官方配好对的；
      #   · 只覆盖 app/build.gradle（为了 minSdk = 24 和 androidx.core 依赖），
      #     并把编译目标对齐到模板的 Java 1.8。
      - name: 4. 组装完整 Flutter 工程
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE"
          OUT="$RUNNER_TEMP/zhinao_build"

          flutter create --org com.zhinao --project-name alarm --platforms android "$OUT"

          # 删掉脚手架里可能出现的 Kotlin DSL 脚本，避免和我们的 Groovy 脚本打架
          find "$OUT/android" -name "*.gradle.kts" -delete

          # 删掉脚手架自带的测试文件（它引用了不存在的 MyApp，会污染静态检查结果）
          rm -rf "$OUT/test"

          # ---- 用项目源码覆盖脚手架 ----
          cp "$SRC/pubspec.yaml"          "$OUT/pubspec.yaml"
          cp "$SRC/analysis_options.yaml" "$OUT/analysis_options.yaml"
          rm -rf "$OUT/lib"
          cp -r "$SRC/lib" "$OUT/lib"

          APP="$OUT/android/app/src/main"
          cp "$SRC/android/app/src/main/AndroidManifest.xml" "$APP/AndroidManifest.xml"
          cp "$SRC/android/app/src/main/res/values/styles.xml" "$APP/res/values/styles.xml"
          mkdir -p "$APP/res/values-night"
          cp "$SRC/android/app/src/main/res/values-night/styles.xml" "$APP/res/values-night/styles.xml"

          rm -rf "$APP/kotlin"
          mkdir -p "$APP/kotlin/com/zhinao/alarm"
          cp "$SRC"/android/app/src/main/kotlin/com/zhinao/alarm/*.kt "$APP/kotlin/com/zhinao/alarm/"

          cp "$SRC/android/app/build.gradle" "$OUT/android/app/build.gradle"

          # ---- 兼容补丁 1：编译目标对齐到模板的 Java 1.8 ----
          sed -i \
            -e "s/JavaVersion\.VERSION_17/JavaVersion.VERSION_1_8/g" \
            -e "s/jvmTarget = \"17\"/jvmTarget = JavaVersion.VERSION_1_8/" \
            "$OUT/android/app/build.gradle"

          # ---- 兼容补丁 2：Kotlin 编译器升到 1.9.24 ----
          # 脚手架默认 1.8.22，但新版插件（sqflite 等）的 Android 代码需要
          # Kotlin 1.9 编译器，否则报 GradleCompilerRunnerWithWorkers → Compilation error。
          # Kotlin 1.9.24 与 Gradle 8.3 / AGP 8.1.0 / JDK 17 兼容。
          sed -i \
            -e "s/id \"org.jetbrains.kotlin.android\" version \"[^\"]*\"/id \"org.jetbrains.kotlin.android\" version \"1.9.24\"/" \
            "$OUT/android/settings.gradle"

          # ---- 兼容补丁 3：sqflite 锁死为 2.3.3 ----
          # pubspec 里若写 ^2.3.3，云端会解析到新版 sqflite，其 Android 代码与
          # 锁定工具链不兼容。这里强制改成精确版本（幂等，改过就无变化）。
          sed -i "s/sqflite: .*/sqflite: 2.3.3/" "$OUT/pubspec.yaml"

          # ---- 兼容补丁 4：withValues -> withOpacity ----
          find "$OUT/lib" -name "*.dart" -print0 | xargs -0 sed -i "s/\.withValues(alpha:/\.withOpacity(/g" || true
          echo "withValues 残留（应为 0）: $(grep -r "withValues" "$OUT/lib" | wc -l)"

          # ---- 自检：确认关键文件都到位、配置正确 ----
          echo "===== 组装完成，关键配置检查 ====="
          echo "--- Kotlin 源文件 ---"
          ls -1 "$APP/kotlin/com/zhinao/alarm/"
          grep -n "kotlin.android" "$OUT/android/settings.gradle"
          grep -n "sqflite" "$OUT/pubspec.yaml"
          grep -n -E "minSdk|Compatibility|jvmTarget|androidx.core" "$OUT/android/app/build.gradle"

      # 现场修一个已知的 Kotlin 编译错误（幂等，已修过则无变化）：
      #
      # RingActivity.roundedButton 的参数名叫 background，而 TextView 上有个同名
      # 属性 background。Kotlin 里函数参数会遮蔽成员属性，于是
      #     background = GradientDrawable().apply { ... }
      # 被编译器理解成「给 Int 类型参数赋值」，报三条错：
      #     Val cannot be reassigned
      #     Type mismatch: inferred type is GradientDrawable but Int was expected  (×2)
      #
      # 这里把参数改名为 bgColor，并改成显式调用 setBackground(...)。
      # 这样即使仓库里的 Kotlin 源码是旧的，也能编过。
      - name: 4.1 修复 RingActivity 变量遮蔽 bug（幂等）
        run: |
          set -euo pipefail
          KT="$RUNNER_TEMP/zhinao_build/android/app/src/main/kotlin/com/zhinao/alarm/RingActivity.kt"
          python3 - "$KT" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          src = path.read_text(encoding="utf-8").replace("\r\n", "\n")

          bad = [
              "background: Int,",
              "background = GradientDrawable",
              "setColor(background)",
              "background = Color.parseColor",
          ]

          # 幂等：源码里已经没有这个 bug 的任何痕迹，就直接跳过
          if not any(b in src for b in bad):
              print("源码不含该 bug，跳过补丁")
              sys.exit(0)

          reps = [
              ("background: Int,", "bgColor: Int,"),
              ("background = GradientDrawable().apply {",
               "setBackground(GradientDrawable().apply {"),
              ("setColor(background)", "setColor(bgColor)"),
              ("background = Color.parseColor", "bgColor = Color.parseColor"),
              ("}\n            layoutParams = LinearLayout.LayoutParams(dp(240), dp(58))",
               "})\n            layoutParams = LinearLayout.LayoutParams(dp(240), dp(58))"),
          ]
          for old, new in reps:
              src = src.replace(old, new)

          problems = []
          for b in bad:
              if b in src:
                  problems.append("仍残留 " + b)
          if "bgColor: Int," not in src:
              problems.append("参数名未改成 bgColor")
          if "setColor(bgColor)" not in src:
              problems.append("setColor 未指向 bgColor")
          if "setBackground(GradientDrawable().apply {" not in src:
              problems.append("setBackground 未生效")
          if "\n            })" not in src:
              problems.append("右括号未补上")

          if problems:
              print("::error::RingActivity 自动修复失败：" + "；".join(problems))
              sys.exit(1)

          path.write_text(src, encoding="utf-8")
          print("RingActivity.kt 变量遮蔽 bug 修复完成")
          PY

          echo "===== 补丁后相关行 ====="
          grep -n -E "bgColor|setBackground|setColor" "$KT" || true

      - name: 5. 拉取 Dart 依赖
        working-directory: ${{ runner.temp }}/zhinao_build
        run: flutter pub get

      # 静态检查：Dart 层的 API 错误在这里就能暴露，不用等 Gradle。
      # 故意不阻断构建（|| true），只把 error 级别的问题变成红色注解。
      - name: 6. Dart 静态检查（报错变成注解，不阻断）
        working-directory: ${{ runner.temp }}/zhinao_build
        run: |
          flutter analyze --no-pub > "$RUNNER_TEMP/analyze_log.txt" 2>&1 || true
          grep -E "error •" "$RUNNER_TEMP/analyze_log.txt" | tail -20 | while IFS= read -r l; do
            l="${l//$'\r'/}"
            l="${l//%/%25}"
            echo "::error::$l"
          done
          echo "===== analyze 结果 ====="
          tail -5 "$RUNNER_TEMP/analyze_log.txt"

      - name: 7. 编译 release APK
        working-directory: ${{ runner.temp }}/zhinao_build
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee "$RUNNER_TEMP/build_log.txt"

      # 构建失败时，把报错关键行提取出来变成「注解」——
      # 注解不需要仓库管理员权限就能远程读到，方便直接定位问题。
      # 注意：Kotlin 编译器报错的行以 "e: " 开头（不含 error 字样），必须单独匹配。
      - name: 8. 失败时提取报错（变成注解）
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build_log.txt"
          if [ ! -f "$LOG" ]; then
            echo "::error::构建日志文件不存在，失败发生在更早的步骤"
            exit 0
          fi

          echo "===== 关键报错行 ====="
          grep -nE "^e: |error:|FAILURE:|What went wrong|Compilation error|Caused by:|Execution failed for task|> Task .* FAILED" "$LOG" \
            | tail -40 > "$RUNNER_TEMP/err_lines.txt" || true
          cat "$RUNNER_TEMP/err_lines.txt"

          echo "===== 日志最后 60 行 ====="
          tail -60 "$LOG"

          head -20 "$RUNNER_TEMP/err_lines.txt" | while IFS= read -r l; do
            l="${l//$'\r'/}"
            l="${l//%/%25}"
            echo "::error::$l"
          done

      # 保险：把完整构建日志也传上来。注解被截断时，可以下载这个文件。
      - name: 8.1 失败时上传完整构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-失败日志
          path: ${{ runner.temp }}/build_log.txt
          if-no-files-found: warn

      - name: 9. 收集产物
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$RUNNER_TEMP/zhinao_build/build/app/outputs/flutter-apk/app-release.apk" \
             "$GITHUB_WORKSPACE/out/zhinao-alarm-v1.0.0.apk"
          ls -lh "$GITHUB_WORKSPACE/out/"

      - name: 10. 上传 APK（在本次运行页面底部下载）
        uses: actions/upload-artifact@v4
        with:
          name: zhinao-alarm-apk
          path: ${{ github.workspace }}/out/zhinao-alarm-v1.0.0.apk
          if-no-files-found: error
